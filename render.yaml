# Render Blueprint。
# Renderダッシュボードで「New → Blueprint」からこのリポジトリを指定すると、
# backend（FastAPI）とfrontend（静的サイト）の2サービスがまとめて作成される。
#
# 無料プラン(free)は15分アクセスがないとスリープし、次のアクセス時に
# 起動待ちが発生する点に注意（数十秒程度）。

services:
  - type: web
    name: ai-investment-radar-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./market_data.db
      - key: ALLOWED_ORIGIN
        fromService:
          type: web
          name: ai-investment-radar-frontend
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: ai-investment-radar-frontend
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: ai-investment-radar-backend
          envVarKey: RENDER_EXTERNAL_URL
